  - type: MeleeWeapon
    damage:
      types:
        Blunt: 12
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
  - type: Item
    size: Huge
    storedSprite:
      state: storage
      sprite: Objects/Tools/rpd_storage_64x.rsi #Done in 64x64 because it looks way too puny in 32x32
    shape:
    - 0,0,3,1
  - type: RCD
    isRpd: true
    availablePrototypes:
    - PipeFourway
    - PipeStraight
    - PipeBend
    - PipeTJunction
    - PipeHalf
    - OutletInjector
    - ManualValve
    - VolumetricPump
    - PressurePump
    - HeatPump
    - TemperatureGate
    - VentScrubber
    - PressureValve
    - PressureRegulator
    - DualPortVent
    - VentGas
    - VentPassive
    - MixerGas
    - Radiator
    - RadiatorBend
    - SignalValve
    - CanisterPort
    - FilterGas
    - ManifoldGas
    - Alarm
    - Sensor
    - SensorPipe
    - Deconstruct
  - type: LimitedCharges
    maxCharges: 45
    charges: 45
  - type: Sprite
    sprite: Objects/Tools/rpd.rsi
  - type: Clothing
    sprite: Objects/Tools/rpd.rsi
    quickEquip: false
    slots:
    - back
    - backStorage
  - type: UserInterface
    interfaces:
      enum.RpdUiKey.Key:
        type: RPDMenuBoundUserInterface
  - type: ActivatableUI
    inHandsOnly: true
    key: enum.RpdUiKey.Key
  - type: ClothingSpeedModifier
    walkModifier: 1.0
    sprintModifier: 1.0

