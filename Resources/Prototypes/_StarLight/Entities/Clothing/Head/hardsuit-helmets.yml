#Spationaut Lead Hardsuit
- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: ClothingHeadHelmetHardsuitSpatioLead
  name: spationaut lead hardsuit helmet
  description: A sturdy decorated helmet designed for complex industrial operations in space.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Head/Hardsuits/leadspatiohelm.rsi
    layers:
      - state: icon
      - state: icon-unshaded
        shader: unshaded
      - state: light-overlay
        visible: false
        shader: unshaded
        map: [ "light" ]
  - type: HandheldLight
    addPrefix: false
  - type: ToggleableVisuals
    clothingVisuals:
      head:
        - state: equipped-head-light
          shader: unshaded
      head-vox:
        - state: equipped-head-light-vox
          shader: unshaded
      head-reptilian:
        - state: equipped-head-light-reptilian
          shader: unshaded
      head-dog:
        - state: equipped-head-light-dog
          shader: unshaded
      head-resomi:
        - state: equipped-head-light-resomi
          shader: unshaded
      head-avali:
        - state: equipped-head-light-avali
          shader: unshaded
  - type: Clothing
    clothingVisuals:
      head:
        - state: equipped-head
        - state: equipped-head-unshaded
          shader: unshaded
      head-vox:
        - state: equipped-head-vox
        - state: equipped-head-unshaded-vox
          shader: unshaded
      head-vulpkanin:
        - state: equipped-head-vulpkanin
        - state: equipped-head-unshaded-vulpkanin
          shader: unshaded
      head-reptilian:
        - state: equipped-head-reptilian
        - state: equipped-head-unshaded-reptilian
          shader: unshaded
      head-dog:
        - state: equipped-head-dog
        - state: equipped-head-unshaded-dog
          shader: unshaded
      head-resomi:
        - state: equipped-head-resomi
        - state: equipped-head-unshaded-resomi
          shader: unshaded
      head-avali:
        - state: equipped-head-avali
        - state: equipped-head-unshaded-avali
          shader: unshaded
  - type: PointLight
    radius: 6
  - type: PressureProtection
    highPressureMultiplier: 0.72
    lowPressureMultiplier: 1000
  - type: Tag
    tags:
      - CorgiWearable

