#SOFTSUITS
#Basic EVA
- type: entity
  id: SuitStorageEVA
  parent: SuitStorageBase
  suffix: EVA
  components:
  - type: StorageFill
    contents:
        - id: NitrogenTankFilled
        - id: OxygenTankFilled
        - id: ClothingOuterHardsuitEVA
        - id: ClothingHeadHelmetEVA
        - id: ClothingMaskBreath
        - id: JetpackMiniFilled # Frontier
  - type: Sprite
    noRot: true
    sprite: _Funkystation/Structures/Storage/Lockers/suit_storage_EVA.rsi
    layers:
    - state: base
    - state: door
      map: [ "enum.StorageVisualLayers.Door" ]
    - state: welded
      visible: false
      map: [ "enum.WeldableLayers.BaseWelded" ]
    - state: locked
      map: [ "enum.LockVisualLayers.Lock" ]
      shader: unshaded

